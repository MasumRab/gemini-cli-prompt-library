# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.8
    - flake8@7.3.0
    - git-diff-check
    - grype@0.116.1
    - isort@8.0.1
    - markdownlint@0.45.0
    - osv-scanner@2.4.0
    - pinact@4.1.1
    - prettier@3.6.2
    - ruff@0.16.1
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - trufflehog@3.96.0
    - lychee
    - yamllint@1.38.0
  definitions:
    - name: lychee
      files: [markdown, html]
      tools: [lychee]
      commands:
        - name: lint
          output: pass_fail
          run: lychee --offline --no-progress --root-dir ${workspace} ${target}
          success_codes: [0, 1]
          cache_results: false
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-check-pre-commit
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
# === Custom linter: lychee link checker ===
# Not in trunk-io/plugins registry — defined here as a custom linter.
# Downloads the official binary from GitHub releases hermetically.
downloads:
  - name: lychee
    version: 0.24.2
    executable: true
    downloads:
      - os: linux
        cpu: x86_64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-unknown-linux-gnu.tar.gz
      - os: linux
        cpu: arm_64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-aarch64-unknown-linux-gnu.tar.gz
      - os: macos
        cpu: x86_64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-apple-darwin.tar.gz
      - os: macos
        cpu: arm_64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-aarch64-apple-darwin.tar.gz
      - os: windows
        cpu: x86_64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-pc-windows-msvc.zip
tools:
  definitions:
    - name: lychee
      download: lychee
      shims: [lychee]
      known_good_version: 0.24.2
