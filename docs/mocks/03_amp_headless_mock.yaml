# Mock 3: Amp / OpenCode (Headless Shell Manifest) Architecture
# Location: .amp.yaml (or AGENTS.md equivalent generated by the framework)

version: "1.0"
tools:
  - name: "dspy_security_review"
    description: "[COMPLEX PIPELINE] Performs a deep security review on a file."
    # Strict enforcement of headless JSON output to prevent TTY hangs.
    command: "python -m dspy_integration.cli --json /code-review:security {file_path}"
  - name: "dspy_list_commands"
    description: "[SKILL] Lists available commands in a category."
    # Simple atomic skill, no LLM call required.
    command: "python -m dspy_integration.cli --json --list {category}"
