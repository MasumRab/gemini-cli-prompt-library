# SonarCloud Configuration for gemini-cli-prompt-library
# This file configures code analysis for SonarCloud

sonar.projectKey=gemini-cli-prompt-library
sonar.organization=your-sonarcloud-org

sonar.host.url=https://sonarcloud.io

# Python configuration
sonar.python.version=3.11

# Source directories to analyze (Python code only)
sonar.sources=dspy_integration/,scripts/

# Test directories
sonar.tests=tests/

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclude non-analyzable content (prompts, docs, archives)
sonar.exclusions=commands/**/*,docs/**/*,*.md,*.toml,archive/**/*,graphite-zips/**/*,.git/**/*

# Main language
sonar.language=py

# Enable PR analysis with GitHub
sonar.pullrequest.provider=github
