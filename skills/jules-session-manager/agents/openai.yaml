name: Jules Session Manager
description: Inspect Google Jules sessions and activities, diagnose recovery states, perform explicitly authorized messages and plan approvals, and correlate sessions with PRs using Jules-project tools.
version: 1.0.0
ui:
  display_name: "Jules Session Manager"
  icon: "jules"
  color: "#4285F4"
  chips:
    - jules
    - google
    - sessions
    - ai-agents
  confidence_score: 0.75
capabilities:
  - List all Jules sessions
  - Inspect session activities
  - Send messages to sessions
  - Approve session plans
  - Diagnose recovery states
  - Track PR task associations
  - Inspect session history
triggers:
  commands:
    - /jules-list
    - /jules-inspect
  natural_language:
    - "list jules sessions"
    - "inspect jules activities"
    - "recover a jules session"
    - "approve a jules plan"
    - "correlate jules sessions with PRs"
    - "jules session manager"
